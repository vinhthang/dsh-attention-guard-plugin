- insert:
    - id: attention-guard
      name: 'dsh-plugin-attention-guard'
      config:
        enabled: true
        model: 'deepseek-flash'
        rtkBinary: 'rtk'
        excludeCommands: []
        maxOutputChars: 2000
        enableOutputOffload: true
        diagnosticsDir: ''
        enableCircuitBreaker: true
        enableMetrics: true
